name: 抖音热点榜每四小时更新

on:
  schedule:
    # UTC 00/04/08/12/16/20 点，即北京时间 08/12/16/20/00/04 点。
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data-update
  cancel-in-progress: false

jobs:
  update-douyin:
    runs-on: ubuntu-latest
    steps:
      - name: 获取网页代码
        uses: actions/checkout@v4
      - name: 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 更新抖音热点榜
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          UPDATE_SCOPE: douyin-hot
        run: node scripts/update-data.mjs
      - name: 保存并发布抖音榜单
        run: |
          git config user.name "知瑶工作台机器人"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "抖音热点榜自动更新"
          git push
