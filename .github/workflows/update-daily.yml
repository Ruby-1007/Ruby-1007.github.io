name: 每日真实数据更新

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-live-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 获取网页代码
        uses: actions/checkout@v4
      - name: 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 采集今日真实数据
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
        run: node scripts/update-data.mjs
      - name: 保存并发布今日数据
        run: |
          git config user.name "灵感月台机器人"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          git diff --cached --quiet || git commit -m "每日真实数据更新"
          git push
